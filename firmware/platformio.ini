[platformio]
default_envs = esp32dev
src_dir = src
include_dir = include

[env:esp32dev]
platform = espressif32@^6.9.0   ; Arduino-ESP32 core 2.x (needed for ledcSetup/ledcAttachPin)
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 460800
lib_deps =
    h2zero/NimBLE-Arduino@^2.1.0
    mikalhart/TinyGPSPlus@^1.1.0
    knolleary/PubSubClient@^2.8
